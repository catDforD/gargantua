        studio: TRIGGER
        director: 宫岛善博
        episodes: 24
        tags: [奇幻, 美食, 冒险]
        intro: >-
          为了救出被红龙吞下的妹妹，莱欧斯一行在迷宫里就地取材，把魔物做成料理。以“吃”为线索的奇幻冒险，脑洞与烟火气齐飞，TRIGGER 的作画让每道魔物料理都充满食欲。
      - title: 比宇宙更遥远的地方
