  - key: music
    name: 音乐
    title: 曲目单
    items:
      - title: SEVENTH HEAVEN
        year: 2022
        # cover 来源: QQ音乐 专辑《visions》封面 https://y.qq.com/n/ryqq/albumDetail/0002xpVr36Glqa (800x800)
        cover: /img/recommendations/music-seventh-heaven.webp
        artist: milet
        type: 专辑曲目
        genre: 日系流行
        tags: [日系流行, J-Pop]
        embed: {netease: '1902312404'}
        embed_note: 该曲在网易云为会员曲目，播放需登录账号。
        intro: >-
          milet 第二张专辑《visions》中的收录曲，英日双语切换的唱腔配上明亮跳跃的鼓点，是专辑里最具元气的一首。后被选为都市开放世界游戏《无限大》(ANANTA) 技术性测试预告片的 BGM，在玩家中广为流传。
      - title: 希望有羽毛和翅膀
        original: Hope Is the Thing With Feathers
        year: 2024
        # cover 来源: QQ音乐 专辑《崩坏星穹铁道-空气蛹 INSIDE》封面 https://y.qq.com/n/ryqq/albumDetail/002HgJfp494Uax (800x800)
        cover: /img/recommendations/music-hope-feathers.webp
        artist: 知更鸟 / HOYO-MiX
        type: 专辑曲目
        genre: 游戏原声
        tags: [游戏原声, 角色曲]
        embed: {netease: '2155423468'}
        intro: >-
          《崩坏：星穹铁道》银河歌者知更鸟的角色专辑《空气蛹 INSIDE》收录曲，英文名取自狄金森的诗句“Hope is the thing with feathers”。清澈的声线与弦乐铺陈出希望与飞翔的意象，是匹诺康尼里最受欢迎的歌曲之一。
      - title: 唯有追赶风的方向
        original: Only By Chasing the Wind
        year: 2026
        # cover 来源: QQ音乐 单曲《崩坏星穹铁道-唯有追赶风的方向》封面 https://y.qq.com/n/ryqq/albumDetail/0011AmNK31mn3Z (800x800)
        cover: /img/recommendations/music-chasing-wind.webp
        artist: 知更鸟 / HOYO-MiX
        type: 单曲
        genre: 游戏原声
        tags: [游戏原声, 角色曲]
        embed: {netease: '3427211241'}
        intro: >-
          知更鸟与 HOYO-MiX 于 2026 年推出的单曲，延续《空气蛹 INSIDE》的温暖声线，以海风、浪花与引擎声为意象，旋律轻快自由，副歌有很强的开阔感。
      - title: 沧海飞尘
        year: 2025
        # cover 来源: QQ音乐 专辑《山色有无中》封面 https://y.qq.com/n/ryqq/albumDetail/002cpBSD4P2chZ (800x800)
        cover: /img/recommendations/music-canghai-feichen.webp
        artist: 银临
        type: 专辑曲目
        genre: 国风
        tags: [国风, 古风]
        embed: {netease: '2094118217'}
        intro: >-
          银临第四张专辑《山色有无中》中的国风作品，旋律苍茫开阔、气韵悠长。后被《凡人修仙传》动画选为插曲，伴随紫灵相关剧情与“今日一别，紫灵后会有期”的名场面广为流传。
      - title: 妄语人间
        year: 2023
        # cover 来源: 网易云音乐 单曲《妄语人间》封面 (900x900)
        cover: /img/recommendations/music-wangyu-renjian.webp
        artist: 忘川风华录
        type: 单曲
        genre: 国风
        tags: [国风, 虚拟歌手]
        embed: {netease: '2031144242'}
        intro: >-
          《忘川风华录》音乐企划为蒲松龄所作的曲目，由虚拟歌手星尘 Infinity 演绎。歌中化用《聊斋志异》的鬼狐意象——“夜雨还魂，纸笔兴波”，编曲清冷诡谲，是企划中极具辨识度的一首。
      - title: Cheekbones
        year: 2024
        # cover 来源: QQ音乐 单曲《Cheekbones》封面 https://y.qq.com/n/ryqq/albumDetail/000yu14Y1KrJqb (800x800)
        cover: /img/recommendations/music-cheekbones.webp
        artist: Arrows in Action
        type: 单曲
        genre: 摇滚
        tags: [摇滚, 欧美]
        embed: {netease: '2634311381'}
        intro: >-
          摇滚乐队 Arrows in Action（2013 年成军）于 2024 年发布的单曲，鼓点干脆、声线略带沙哑，副歌律动感极强，也常出现在各类“日推歌单”里。
      - title: A Long Way
        year: 2015
        # cover 来源: 网易云音乐 专辑《Home》封面 https://music.163.com/album?id=3120013 (800x800)
        cover: /img/recommendations/music-a-long-way.webp
        artist: Josh Garrels
        type: 专辑曲目
        genre: 民谣
        tags: [民谣, 欧美]
        embed: {netease: '31460059'}
        intro: >-
          美国民谣唱作人 Josh Garrels 2015 年专辑《Home》的第三轨。木吉他与弦乐缓缓铺开，副歌反复念着“I came a long long way back home / to see you one more time”，像一封写给父亲和旧居的归乡信。专辑发行首周即登上 Billboard 200 第 83 位，这首慢歌是其中情绪最沉的一首。
