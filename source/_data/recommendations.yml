          以赛马拟人化为主题的系列动画第二季，聚焦东海帝王与目白麦昆之间既是对手、又是挚友的羁绊。热血与泪水的密度极高，被普遍认为是系列完成度最高的一季。
      - title: 葬送的芙莉莲
        original: 葬送のフリーレン
        year: 2023
        # cover 来源: https://movie.douban.com/subject/36093351/ (708x1000)
        cover: /img/recommendations/anime-frieren.webp
        studio: MADHOUSE
        director: 斋藤圭一郎
        episodes: 28
        tags: [奇幻, 治愈, 冒险]
        intro: >-
          勇者一行讨伐魔王之后，长命的精灵魔法使芙莉莲才开始真正理解“人”与“时间”。以旅程串起回忆与告别，安静克制却处处动人，是近年评价最高的奇幻动画之一。
      - title: 迷宫饭
