<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>只在你眼里，世界有光</title>
    <link rel="icon" href="/img/fluid.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="页面标题">
      <a class="brand" href="#top" aria-label="回到首页">DANDADAN</a>
      <span>Love Edit</span>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <img class="hero__image" src="./assets/images/01.png" alt="女生托腮看着坐在身边读书的男生" />
        <div class="hero__shade"></div>
        <div class="hero__copy">
          <p class="eyebrow">A quiet fever</p>
          <h1 class="hero-title" id="hero-title">
            <span class="hero-title__line">还记得第一面</span>
            <span class="hero-title__line">见到你</span>
            <span class="hero-title__line">我心是怎样波动</span>
          </h1>
          <p>喧闹、失控、坠落之前，先学会彼此靠近。</p>
        </div>
      </section>

      <section class="gallery" aria-label="爱情影像序列">
        <div class="story-duo" aria-label="回声与靠近">
          <figure class="photo photo--wide">
            <button class="photo__button" type="button" data-index="0">
              <img src="./assets/images/02.png" alt="男生站在火光与夜色之间" />
            </button>
            <figcaption><span>02</span><strong>回声</strong><em>每一次看见你，世界都开始失重。</em></figcaption>
          </figure>

          <figure class="photo photo--offset-right">
            <button class="photo__button" type="button" data-index="1">
              <img src="./assets/images/03.png" alt="两人在明亮窗前亲吻" loading="lazy" />
            </button>
            <figcaption><span>03</span><strong>靠近</strong><em>答案落在呼吸相接的一秒。</em></figcaption>
          </figure>
        </div>

        <div class="photo-pair" aria-label="秒针与心意">
          <figure class="photo">
            <button class="photo__button" type="button" data-index="3">
              <img src="./assets/images/04.png" alt="男生戴着圆框眼镜望向前方" loading="lazy" />
            </button>
            <figcaption><span>04</span><strong>秒针</strong><em>心意在倒数里变得清楚。</em></figcaption>
          </figure>

          <figure class="photo photo--wide">
            <button class="photo__button" type="button" data-index="4">
              <img src="./assets/images/05.png" alt="女生在教室里抬头凝视" loading="lazy" />
            </button>
            <figcaption><span>05</span><strong>心意</strong><em>她没有躲开自己的认真。</em></figcaption>
          </figure>
        </div>

        <figure class="photo photo--cinema">
          <button class="photo__button" type="button" data-index="5">
            <img src="./assets/images/06.png" alt="星空下两人隔着画面遥望" loading="lazy" />
          </button>
          <figcaption><span>06</span><strong>星夜</strong><em>夜空很大，想念很近。</em></figcaption>
        </figure>

        <figure class="photo photo--cinema">
          <button class="photo__button" type="button" data-index="6">
            <img src="./assets/images/07.png" alt="夜晚女生抱着物品微笑" loading="lazy" />
          </button>
          <figcaption><span>07</span><strong>回忆</strong><em>笑意像暗处保存下来的火。</em></figcaption>
        </figure>

        <figure class="photo photo--cinema">
          <button class="photo__button" type="button" data-index="9">
            <img src="./assets/images/10.png" alt="两人分置画面两侧低头沉思" loading="lazy" />
          </button>
          <figcaption><span>10</span><strong>分线</strong><em>沉默也在靠近。</em></figcaption>
        </figure>

        <figure class="photo">
          <button class="photo__button" type="button" data-index="7">
            <img src="./assets/images/08.png" alt="男生霓虹光下的眼睛特写" loading="lazy" />
          </button>
          <figcaption><span>08</span><strong>心跳</strong><em>颜色替他把秘密说出口。</em></figcaption>
        </figure>

        <figure class="photo">
          <button class="photo__button" type="button" data-index="8">
            <img src="./assets/images/09.png" alt="女生在强烈霓虹光中仰头呼喊" loading="lazy" />
          </button>
          <figcaption><span>09</span><strong>失重</strong><em>爱有时像被光突然击中。</em></figcaption>
        </figure>

        <figure class="photo">
          <button class="photo__button" type="button" data-index="11">
            <img src="./assets/images/12.png" alt="红色光影中女生蜷身漂浮" loading="lazy" />
          </button>
          <figcaption><span>12</span><strong>炽热</strong><em>所有克制都藏着燃烧。</em></figcaption>
        </figure>

        <figure class="photo">
          <button class="photo__button" type="button" data-index="12">
            <img src="./assets/images/13.png" alt="男生在月色与黄光前行动" loading="lazy" />
          </button>
          <figcaption><span>13</span><strong>月下</strong><em>他带着夜色奔向答案。</em></figcaption>
        </figure>

        <figure class="photo photo--final">
          <button class="photo__button" type="button" data-index="13">
            <img src="./assets/images/14.png" alt="两人倒置同框看向镜头" loading="lazy" />
          </button>
          <figcaption><span>14</span><strong>同框</strong><em>故事最后，世界被翻转成他们的方向。</em></figcaption>
        </figure>
      </section>
    </main>

    <audio class="music-player" src="./assets/audio/bgm.mp3" preload="metadata" loop></audio>
    <button class="music-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false" title="播放背景音乐">
      <span class="music-toggle__icon" aria-hidden="true">♪</span>
    </button>

    <div class="lightbox" aria-hidden="true" role="dialog" aria-label="图片预览">
      <button class="lightbox__close" type="button" aria-label="关闭预览" title="关闭">×</button>
      <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="上一张" title="上一张">‹</button>
      <figure class="lightbox__stage">
        <img src="" alt="" />
        <figcaption></figcaption>
      </figure>
      <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="下一张" title="下一张">›</button>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
