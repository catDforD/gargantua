name: Deploy Hexo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      - name: Configure SSH
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 38.55.34.92 >> ~/.ssh/known_hosts

      - name: Deploy static site
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          rsync -az --delete public/ hexodeploy@38.55.34.92:/var/www/catdfd.com/
