<section class="rec-panel rec-panel--books" role="tabpanel" id="rec-panel-books" aria-labelledby="rec-tab-books"><header class="rec-panel__head"><h2>书架</h2></header><div class="rec-grid rec-grid--books"><button class="rec-card rec-card--books" type="button" data-rec-open="rec-books-0" style="--hue:144" aria-label="查看《明朝那些事儿》详情"><span class="rec-book"><span class="rec-book__object"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-mingchao.webp" alt="明朝那些事儿 封面" loading="lazy"></span></span></span><span class="rec-caption"><strong>明朝那些事儿</strong><em>当年明月 · 2006</em></span></button><template id="rec-books-0"><div class="rec-detail rec-detail--books"><div class="rec-detail__cover"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-mingchao.webp" alt="明朝那些事儿 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker">书籍 · 2006</p><h3 class="rec-detail__title">明朝那些事儿</h3><dl class="rec-detail__meta"><div><dt>作者</dt><dd>当年明月</dd></div><div><dt>出版</dt><dd>中国友谊出版公司</dd></div><div><dt>年份</dt><dd>2006</dd></div><div><dt>页数</dt><dd>298</dd></div></dl><ul class="rec-tags"><li>历史</li><li>明朝</li><li>通俗历史</li></ul><section class="rec-detail__section rec-detail__section--intro"><h4>简介</h4><p>当年明月把三百年明史写成能一口气读完的故事：从朱元璋起兵到崇祯自缢，帝王心术、官场争斗与小人物命运彼此交织。语言口语化、段落短促，史实打底却不失趣味，是很多读者历史阅读的起点。</p></section></div></div></template><button class="rec-card rec-card--books" type="button" data-rec-open="rec-books-1" style="--hue:64" aria-label="查看《银河帝国》详情"><span class="rec-book"><span class="rec-book__object"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-galactic-empire.webp" alt="银河帝国 封面" loading="lazy"></span></span></span><span class="rec-caption"><strong>银河帝国</strong><em>艾萨克·阿西莫夫 · 2015</em></span></button><template id="rec-books-1"><div class="rec-detail rec-detail--books"><div class="rec-detail__cover"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-galactic-empire.webp" alt="银河帝国 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker">书籍 · 2015</p><h3 class="rec-detail__title">银河帝国</h3><p class="rec-detail__original">Foundation</p><dl class="rec-detail__meta"><div><dt>作者</dt><dd>艾萨克·阿西莫夫</dd></div><div><dt>译者</dt><dd>叶李华</dd></div><div><dt>出版</dt><dd>江苏凤凰文艺出版社</dd></div><div><dt>年份</dt><dd>2015</dd></div><div><dt>页数</dt><dd>2888</dd></div></dl><ul class="rec-tags"><li>科幻</li><li>太空歌剧</li><li>心理史学</li></ul><section class="rec-detail__section rec-detail__section--intro"><h4>简介</h4><p>哈里·谢顿用“心理史学”推算出银河帝国终将崩塌，于是在漫长黑暗期到来前布下基地，为文明保存火种。阿西莫夫把历史推演写成一场推理游戏，基地七部曲从头读到尾，会重新掂量“大势”二字的分量。</p></section></div></div></template><button class="rec-card rec-card--books" type="button" data-rec-open="rec-books-2" style="--hue:289" aria-label="查看《三体》详情"><span class="rec-book"><span class="rec-book__object"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-three-body.webp" alt="三体 封面" loading="lazy"></span></span></span><span class="rec-caption"><strong>三体</strong><em>刘慈欣 · 2008</em></span></button><template id="rec-books-2"><div class="rec-detail rec-detail--books"><div class="rec-detail__cover"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-three-body.webp" alt="三体 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker">书籍 · 2008</p><h3 class="rec-detail__title">三体</h3><dl class="rec-detail__meta"><div><dt>作者</dt><dd>刘慈欣</dd></div><div><dt>出版</dt><dd>重庆出版社</dd></div><div><dt>年份</dt><dd>2008</dd></div><div><dt>页数</dt><dd>302</dd></div></dl><ul class="rec-tags"><li>科幻</li><li>硬科幻</li><li>中国科幻</li></ul><section class="rec-detail__section rec-detail__section--intro"><h4>简介</h4><p>“地球往事”三部曲的开篇。一次秘密的星际通讯，把人类文明放进宇宙尺度重新打量：技术的鸿沟、道德的困境与生存的代价被逐一摊开。想象力密集到近乎奢侈，是中文科幻真正走向世界的那一部。</p></section></div></div></template><button class="rec-card rec-card--books" type="button" data-rec-open="rec-books-3" style="--hue:185" aria-label="查看《我们生活在南京》详情"><span class="rec-book"><span class="rec-book__object"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-nanjing.webp" alt="我们生活在南京 封面" loading="lazy"></span></span></span><span class="rec-caption"><strong>我们生活在南京</strong><em>天瑞说符 · 2022</em></span></button><template id="rec-books-3"><div class="rec-detail rec-detail--books"><div class="rec-detail__cover"><span class="rec-cover rec-cover--books"><img src="/img/recommendations/book-nanjing.webp" alt="我们生活在南京 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker">书籍 · 2022</p><h3 class="rec-detail__title">我们生活在南京</h3><dl class="rec-detail__meta"><div><dt>作者</dt><dd>天瑞说符</dd></div><div><dt>出版</dt><dd>中信出版社</dd></div><div><dt>年份</dt><dd>2022</dd></div><div><dt>页数</dt><dd>872</dd></div></dl><ul class="rec-tags"><li>科幻</li><li>末世</li><li>时空通信</li></ul><section class="rec-detail__section rec-detail__section--intro"><h4>简介</h4><p>末日之后的南京成了一座空城，而 2019 年的高三学生白杨，用一台业余电台联系上了那里。废墟与习题、生存与日常交替出现，硬核设定之下是相当温柔的笔触。银河奖得主天瑞说符的代表作。</p></section></div></div></template></div></section><section class="rec-panel rec-panel--movies" role="tabpanel" id="rec-panel-movies" aria-labelledby="rec-tab-movies" hidden><header class="rec-panel__head"><h2>放映厅</h2></header><div class="rec-grid rec-grid--movies"><button class="rec-card rec-card--movies" type="button" data-rec-open="rec-movies-0" style="--hue:51" aria-label="查看《星际穿越》详情"><span class="rec-poster"><span class="rec-cover rec-cover--movies"><img src="/img/recommendations/movie-interstellar.webp" alt="星际穿越 封面" loading="lazy"></span></span><span class="rec-caption"><strong>星际穿越</strong><em>克里斯托弗·诺兰 · 2014</em></span></button><template id="rec-movies-0"><div class="rec-detail rec-detail--movies"><div class="rec-detail__cover"><span class="rec-cover rec-cover--movies"><img src="/img/recommendations/movie-interstellar.webp" alt="星际穿越 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker"> ="--hue:256" aria-label="查看《古田军号》详情"><span class="rec-poster"><span class="rec-cover rec-cover--movies"><img src="/img/recommendations/movie-gutian-junhao.webp" alt="古田军号 封面" loading="lazy"></span></span><span class="rec-caption"><strong>古田军号</strong><em>陈力 · 2019</em></span></button><template id="rec-movies-2"><div class="rec-detail rec-detail--movies"><div class="rec-detail__cover"><span class="rec-cover rec-cover--movies"><img src="/img/recommendations/movie-gutian-junhao.webp" alt="古田军号 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker">电影 · 2019</p><h3 class="rec-detail__title">古田军号</h3><dl class="rec-detail__meta"><div><dt>导演</dt><dd>陈力</dd></div><div><dt>主演</dt><dd>王仁君 / 王志飞 / 刘智扬 / 胡兵</dd></div><div><dt>地区</dt><dd>中国大陆</dd></div><div><dt>年份</dt><dd>2019</dd></div><div><dt>片长</dt><dd>120分钟</dd></div></dl><ul class="rec-tags"><li>历史</li><li>战争</li></ul><section class="rec-detail__section rec-detail__section--intro"><h4>简介</h4><p>庆祝新中国成立 70 周年的重大革命历史题材影片，以一个红军小号手的视角，回望红军从井冈山突围到闽西、在绝境中摸索真理的岁月。陈力导演用年轻化的表达，让那段历史变得可感可近。</p></section></div></div></template><button class="rec-card rec-card--movies" type="button" data-rec-open="rec-movies-3" style="--hue:32" aria-label="查看《流浪地球》详情"><span class="rec-poster"><span class="rec-cover rec-cover--movies"><img src="/img/recommendations/movie-wandering-earth.webp" alt="流浪地球 封面" loading="lazy"></span></span><span class="rec-caption"><strong>流浪地球</strong><em>郭帆 · 2019</em></span></button><template id="rec-movies-3"><div class="rec-detail rec-detail--movies"><div class="rec-detail__cover"><span class="rec-cover rec-cover--movies"><img src="/img/recommendations/movie-wandering-earth.webp" alt="流浪地球 封面" loading="lazy"></span></div><div class="rec-detail__body"><p class="rec-detail__kicker">电影 · 2019</p><h3 class="rec-detail__title">流浪地球</h3><p class="rec-detail__original">The Wandering Earth</p><dl class="rec-detail__meta"><div><dt>导演</dt><dd>郭帆</dd></div><div><dt>主演</dt><dd>吴京 / 屈楚萧 / 李光洁 /
